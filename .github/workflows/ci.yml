name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: OCR engine
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr
      - name: All checks
        run: bash scripts/ci.sh
      - name: Server log on failure
        if: failure()
        run: tail -100 logs/ci-server.log || true
